# Alexandria descriptor: every book listed here is downloaded from Project
# Gutenberg and converted into a ZIM file in `output/`.
#
# Per-book keys:
#   id        Gutenberg ebook number (required)
#   title     display title; shown by `make list` and used as the ZIM title
#   author    display author; replaces the RDF creator in the ZIM and library
#   language  override the RDF language (ISO 639-1 or 639-3)
#   html      use a local HTML file instead of downloading the ebook
#   rdf       use a local RDF metadata file instead of downloading it
#   modernize rewrite archaic English into modern English (default false)
#   build     false keeps the entry but skips it (default true)
#
# Entries marked "# rebuild list" are candidates for a civilisation-rebuild
# library; they are disabled until reviewed by hand.
#
# Books are sorted by id so new entries are easy to place by hand.
# Titles come from input/top_100.txt; comments show the top-100 rank.

output: output
cache: cache

